; Alek's Photo Mode SA v2.2.2
; Casi todo se ajusta dentro del juego (menú > AJUSTES). Lo que cambias se guarda en
;   Documentos\GTA San Andreas User Files\Aleks Photo Mode.ini
; (así MO2 u otros gestores no lo borran). Este archivo sirve de valores por defecto.
; Almost everything is set in game (menu > SETTINGS). Your changes are saved in
;   Documents\GTA San Andreas User Files\Aleks Photo Mode.ini
; (so MO2 or other mod managers cannot wipe them). This file holds the defaults.

[PhotoMode]
; Tecla para abrir/cerrar en teclado (código virtual; 117 = F6) / keyboard open key (117 = F6)
KeyboardKey=117
; Carpeta de fotos (gana sobre AJUSTES > Carpeta de fotos). Vacío = la del menú / photo folder (wins over SETTINGS > Photo folder). Empty = the menu's
PhotoFolder=
; Distancia máxima de la cámara al jugador (metros) / max camera distance from the player (m)
MaxDistance=160
MoveSpeed=12
LookSpeed=100
; Milisegundos que hay que mantener Círculo para salir / ms to hold Circle to exit
HoldMs=600
RenderUnpause=1
Collision=1
FixPedPoses=1

[Interface]
Font=Bahnschrift SemiBold

[Diag]
Level=0
AutoTest=0

[CustomPoses]
; Poses propias: se añaden al final de COMPONER > Pose de CJ. Una por línea:
;   Nombre=bloque ifp,animación[,ground]
; El bloque es el nombre del .ifp sin extensión (instalado con modloader como cualquier animación).
; "ground" la deja apoyada en el piso, como Sentado y Acostado. Quita el ; para activar el ejemplo.
; Your own poses: added at the end of COMPOSE > CJ pose. One per line:
;   Name=ifp block,animation[,ground]
; The block is the .ifp's name without extension. "ground" makes it rest on the floor. Remove the ; to try the example.
;Sentado en la banqueta=ped,SEAT_idle,ground
