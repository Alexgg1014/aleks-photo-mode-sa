; Alek's Photo Mode SA v2.0
; Casi todo se ajusta dentro del juego (menú > AJUSTES); se guarda solo en la sección [Menu].
; Almost everything is set in game (menu > SETTINGS); it is saved by itself under [Menu].

[PhotoMode]
; Tecla para abrir/cerrar en teclado (código virtual; 117 = F6) / keyboard open key (117 = F6)
KeyboardKey=117
; Carpeta de fotos. Vacío = Imágenes\GTA San Andreas Photo Mode / empty = Pictures\GTA San Andreas Photo Mode
PhotoFolder=
; Distancia máxima de la cámara al jugador (metros) / max camera distance from the player (m)
MaxDistance=160
MoveSpeed=12
LookSpeed=100
; Milisegundos que hay que mantener Círculo para salir / ms to hold Circle to exit
HoldMs=600
RenderUnpause=1
Collision=1
FixPedPoses=1

[Interface]
Font=Bahnschrift SemiBold

[Diag]
Level=0
AutoTest=0
